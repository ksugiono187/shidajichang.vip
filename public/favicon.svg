<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#icon-grad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Speed / Airport Jet Emblem -->
  <g filter="url(#glow)">
    <!-- Main Jet Path -->
    <path d="M 94 34 L 38 60 L 58 72 L 64 92 L 74 78 L 94 34 Z" fill="url(#icon-grad)"/>
    <!-- Speed Trails -->
    <path d="M 26 44 L 46 44" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 18 60 L 34 60" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 22 76 L 42 76" stroke="#a855f7" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
